- title: One step sparring
  grades: Blue belt
  color: blue
  sequences:
    - A: Walking stance punch
      D: Rear foot stance upward block
      C: Flying turning kick
    - A: Walking stance flat fingertip thrust
      D: ~
      C: Flying front snap kick
    - A: Side turning kick
      D: Dodge to forearm guarding block
      C: Flying side piercing kick (front foot)

- title: One step sparring
  grades: Red stripe
  color: blue-red
  sequences:
    - A: Walking stance punch
      D: Hooking kick
      C: Flying inward vertical kick
    - A: Walking stance upset fingertip thrust
      D: Dodge to knifehand low guarding block
      C: Flying back piercing kick
    - A: Side piercing kick
      D: Crescent kick
      C: Flying reverse turning kick
  notes:
    - For the flying inward vertical kick, in the previous move you have stepped back into a half facing stance after the hooking kick. Visualise a rectangle on the floor from your L-stance and as you turn full facing for the kick don't let your rear foot go outside the rectangle. The knee primarily goes up first, then the foot flicks inward the height has been achieved. The tool used is the reverse footsword, and the target for the kick is the head, however your distance should make this technique safe to perform without contacting your opponent (i.e. showing intent without impact).

